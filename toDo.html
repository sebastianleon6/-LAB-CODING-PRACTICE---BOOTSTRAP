<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="todoStyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="body">

    <header class="text-center mt-4">
        <h1 id="titulo" class="fw-bold text-primary">Mi lista de tareas 👌</h1>
    </header>

    <main class="container mt-4 d-flex flex-column align-items-center" style="max-width: 600px;">
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                
                <ul id="lista-tareas" class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Estudiar HTML
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Tomar cafecito ☕
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Estudiar JS
                    </li>
                </ul>

            </div>
        </div>
        <form id="formulario-tarea" class="d-flex gap-2 mb-4">

            <input 
                type="text" 
                name="tarea" 
                id="nueva-tarea" 
                class="form-control shadow-sm" 
                placeholder="Ingrese una tarea" 
                required
            >
            <button type="submit" id="agregar" class="btn btn-primary shadow-sm">
                Agregar
            </button>
        </form>
        <img src="./lista.png" alt="Lista de tareas" class="img-fluid">
    </main>
    <script src="script.js"></script>
</body>
</html>
